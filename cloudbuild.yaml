substitutions:
  _REGION: us-east1
  _SERVICE: astra-note-builder
  _REPOSITORY: astra-apps

steps:
  - name: node:24-bookworm-slim
    entrypoint: npm
    args: [ci]
  - name: node:24-bookworm-slim
    entrypoint: npm
    args: [test]
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$COMMIT_SHA
      - .
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$COMMIT_SHA
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$COMMIT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --no-traffic
      - --tag=candidate
      - --service-account=astra-note-builder@$PROJECT_ID.iam.gserviceaccount.com
      - --update-env-vars=ASTRA_BUILD_ID=$COMMIT_SHA

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$COMMIT_SHA
