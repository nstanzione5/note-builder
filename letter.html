<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Astra Letters">
  <title>Astra Letter Writer</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body
  data-app-build-id="20260601-drive-repair-clarity"
  data-astra-letter-gpt-url="https://chatgpt.com/g/g-69ff5644fd80819182ccbb07dfee15fa-astra-document-generator"
  data-drive-sync-enabled="true"
  data-drive-endpoint-url="https://script.google.com/macros/s/AKfycbwQDnypS2DgQJaFsrjAoMsU7ejP1Lu-n22SybUzfpv3JF7OMYEdJEfbS0oMedxm6GXWKw/exec"
  data-drive-shared-drive-id="0AHnYqpJA5-6ZUk9PVA"
  data-drive-root-folder-id="199ZOouP0Sy21NSDHyw_AN4-YgOKW-AbE"
  data-drive-root-folder-name="Note App"
  data-drive-user-email=""
  data-drive-owner-email="nick@astrapsychiatry.com"
  data-drive-service-token=""
  data-drive-owner-token=""
>
  <main class="app-shell letter-page-shell">
    <section class="brand-panel letter-hero letter-hero-compact">
      <div class="letter-compact-mark" aria-hidden="true">
        <img src="assets/astra-logo-horizontal.png" alt="">
      </div>
      <div class="brand-copy">
        <span class="brand-kicker">Astra Psychiatry</span>
        <div class="brand-title-row">
          <h1>Letter Writer</h1>
          <span class="brand-mode-pill">GPT Handoff</span>
        </div>
      </div>
      <nav class="brand-tools-rail letter-nav" aria-label="Letter tools">
        <a class="brand-tool-btn" href="index.html" data-tooltip="Back to Notes" aria-label="Back to note generator">
          <span class="tool-emoji" aria-hidden="true">&larr;</span>
        </a>
        <button class="brand-tool-btn letter-open-rail" id="openLetterGptRailBtn" type="button" data-tooltip="Open Letter GPT" aria-label="Open Letter GPT">
          <span class="tool-emoji" aria-hidden="true">&#8599;</span>
        </button>
      </nav>
    </section>

    <section class="letter-layout letter-layout-single">
      <section class="card letter-form-card letter-form-card-compact" aria-labelledby="letterWriterTitle">
        <div class="section-heading">
          <div>
            <h2 id="letterWriterTitle">Patient Letter Packet</h2>
            <p>Astra Document GPT packet.</p>
          </div>
          <div class="letter-status-actions">
            <div class="section-mini-badge" id="clinicianConfigStatus">Loading clinicians</div>
            <button class="mini-btn" id="refreshCliniciansBtn" type="button">Refresh Clinicians</button>
          </div>
        </div>

        <div class="letter-builder-section">
          <h3>Setup</h3>
          <div class="grid grid-2">
            <div class="field">
              <label for="letterType">Letter Type</label>
              <div class="select-shell">
                <select id="letterType" data-letter-field>
                  <option value="workSchoolNote">Work / School Note</option>
                  <option value="returnToWorkSchool">Return to Work / School</option>
                  <option value="treatmentVerification">Treatment Verification</option>
                  <option value="accommodation">Accommodation Letter</option>
                  <option value="esa">Emotional Support Animal Letter</option>
                  <option value="medicationTreatmentSummary">Medication / Treatment Summary</option>
                  <option value="medicalNecessity">Medical Necessity / Prior Authorization Support</option>
                  <option value="discharge">Discharge Letter</option>
                  <option value="custom">Custom Letter</option>
                </select>
              </div>
            </div>

            <div class="field">
              <label for="letterDate">Letter Date</label>
              <div class="inline-input-row">
                <input id="letterDate" data-letter-field type="date">
                <button type="button" class="mini-btn" id="letterDateTodayBtn">Today</button>
              </div>
            </div>

            <div class="field">
              <label for="clinicianSelect">Clinician</label>
              <div class="select-shell">
                <select id="clinicianSelect" data-letter-field></select>
              </div>
            </div>

            <div class="field">
              <label>State</label>
              <div class="segmented-control segmented-control-form state-toggle" id="clinicianStateToggle" role="group" aria-label="Clinician state">
                <button type="button" class="seg-btn" data-clinician-state="NY">NY</button>
                <button type="button" class="seg-btn" data-clinician-state="CT">CT</button>
                <button type="button" class="seg-btn" data-clinician-state="DE">DE</button>
              </div>
            </div>
          </div>

          <div class="clinician-meta" id="clinicianMeta" aria-live="polite"></div>
        </div>

        <div class="letter-builder-section">
          <h3>Request</h3>
          <div class="grid grid-2">
            <div class="field">
              <label for="letterRecipient">Recipient / Organization</label>
              <input id="letterRecipient" data-letter-field type="text" autocomplete="off">
            </div>
            <div class="field">
              <label for="letterRecipientAddress">Address or Fax</label>
              <input id="letterRecipientAddress" data-letter-field type="text" autocomplete="off">
            </div>
            <div class="field field-full">
              <label for="letterPurpose">Purpose / Key Request Details</label>
              <textarea id="letterPurpose" data-letter-field rows="6" placeholder="Briefly state what the letter should accomplish and any details the GPT should honor."></textarea>
            </div>
          </div>
        </div>

        <div class="letter-builder-section">
          <h3>Source</h3>
          <div class="letter-toggle-grid letter-toggle-grid-compact">
            <label class="script-switch" for="letterPreviousNoteUploaded"><input id="letterPreviousNoteUploaded" data-letter-checkbox type="checkbox" checked><span class="switch-track" aria-hidden="true"></span><span class="switch-label">Prior note will be uploaded to GPT</span></label>
          </div>
        </div>

        <div class="letter-builder-section">
          <h3>Disclosure</h3>
          <div class="letter-toggle-grid letter-toggle-grid-compact">
            <label class="script-switch" for="letterConsentConfirmed"><input id="letterConsentConfirmed" data-letter-checkbox type="checkbox"><span class="switch-track" aria-hidden="true"></span><span class="switch-label">Consent/release confirmed</span></label>
            <label class="script-switch" for="letterIncludeDiagnosis"><input id="letterIncludeDiagnosis" data-letter-checkbox type="checkbox"><span class="switch-track" aria-hidden="true"></span><span class="switch-label">Allow diagnosis</span></label>
            <label class="script-switch" for="letterIncludeMedications"><input id="letterIncludeMedications" data-letter-checkbox type="checkbox"><span class="switch-track" aria-hidden="true"></span><span class="switch-label">Allow medications</span></label>
            <label class="script-switch" for="letterIncludeFunctionalLimitations"><input id="letterIncludeFunctionalLimitations" data-letter-checkbox type="checkbox"><span class="switch-track" aria-hidden="true"></span><span class="switch-label">Allow functional limits</span></label>
          </div>
          <p class="letter-warning hidden" id="letterConsentWarning">Consent has not been confirmed. Do not finalize or send a third-party letter until consent is confirmed.</p>
        </div>

        <div class="action-row letter-action-row">
          <button id="copyLetterPacketBtn" type="button">Copy Packet</button>
          <button id="copyOpenLetterGptBtn" type="button">Copy &amp; Open GPT</button>
          <button id="openLetterGptBtn" type="button">Open GPT</button>
          <button id="clearLetterFieldsBtn" type="button">Clear</button>
        </div>
        <textarea id="letterExportBox" class="hidden" readonly aria-hidden="true" tabindex="-1"></textarea>
      </section>
    </section>
  </main>

  <script src="letter.js"></script>
</body>
</html>
